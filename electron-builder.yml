appId: com.deadalley.gameshelf
productName: GameShelf
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/sql.js/dist/sql-wasm.wasm
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: GameShelf-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GameShelf
# Writes latest.yml next to the installer; the app reads it from the GitHub release to find updates.
publish:
  provider: github
  owner: deadalley
  repo: game-shelf
  releaseType: release
